# Configuración de NGINX del backoffice (imagen nginx-unprivileged: escucha en 8080 y no corre como root).
#
# Este archivo reemplaza a /etc/nginx/conf.d/default.conf, así que vive dentro del contexto `http`.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No exponer la versión de NGINX.
    server_tokens off;

    # --- Compresión ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Headers de seguridad (OWASP A05) ---
    # `always` para que también salgan en las respuestas de error.
    # Ojo: un `add_header` dentro de un `location` descarta los de este nivel, por eso los `location`
    # de abajo no definen ninguno propio (el caché va con `expires`).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Páginas de error propias (heurísticas 5 y 9 de Nielsen) ---
    error_page 404 /errors/404.html;
    error_page 502 /errors/502.html;
    error_page 503 504 /errors/503.html;

    location ^~ /errors/ {
        internal;
        root /usr/share/nginx;
    }

    # --- Proxy hacia el backend: el navegador ve todo en el mismo origen, así que no hace falta CORS ---
    # El nombre se resuelve en cada petición (DNS interno de Docker) en vez de al arrancar: NGINX
    # arranca aunque el backend todavía no exista y sigue al backend si se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Las evidencias son fotos y actas: el límite por defecto (1 MB) las rechazaría.
    client_max_body_size 25m;

    # Directivas comunes de proxy: los `location` de abajo las heredan (no definen `proxy_set_header` propios).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # NGINX es el proxy de borde único: pisa X-Forwarded-For con la IP de conexión real ($remote_addr)
    # en lugar de anexarla a la cabecera previa del cliente, evitando falsificación de IP (spoofing).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # `^~` evita que la regla de archivos estáticos de más abajo capture rutas de la API con punto.
    location ^~ /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    location = /salud {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    location = /health {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    # --- Estáticos ---
    # Cualquier ruta que termina en extensión es un archivo: si no existe, 404 de verdad (con la
    # página propia) en lugar de devolver el index de la SPA.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # El index no se cachea: es el que apunta a los bundles con hash del build vigente.
    location = /index.html {
        expires -1;
    }

    # Cualquier otra ruta es de la SPA (rutas del router de Angular): cae en el index.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
