<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 · No encontramos esa página — Planillero</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8; color: #1c2733;
    }
    main { max-width: 520px; background: #fff; border-radius: 12px; padding: 40px 32px; box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; }
    .code { font-size: 64px; font-weight: 700; line-height: 1; color: #1f5fbf; margin: 0 0 8px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.5; margin: 0 0 24px; color: #4a5866; }
    a { display: inline-block; padding: 12px 24px; border-radius: 8px; background: #1f5fbf; color: #fff; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #ffb400; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      body { background: #12181f; color: #e6ebf0; }
      main { background: #1b242e; box-shadow: none; }
      p { color: #a9b6c3; }
      .code { color: #6ea8ff; }
      a { background: #3b82f6; }
    }
  </style>
</head>
<body>
  <main role="main">
    <p class="code" aria-hidden="true">404</p>
    <h1>No encontramos esa página</h1>
    <p>La dirección que buscás no existe o ya no está disponible. Revisá que esté bien escrita o volvé al inicio para seguir trabajando.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
